lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.2
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.015
hsv_s: 0.7        
hsv_v: 0.4          
degrees: 5.0          # default 0.0   Help AI read license plates better when cars are parked diagonally or at an angle.
translate: 0.1        
scale: 0.5            
shear: 2.0            # default 0.0   Tolerance to parallelogram distortion (when the camera is mounted high and looking down at an angle).
perspective: 0.0007   # default 0.0   Creates a simulated 3D effect, helping to better identify license plates that are distorted at the edges of the image.
flipud: 0.0           # default 0.0   Keep it as is (the license plate in real life wasn't flipped over by the girl).                                                
fliplr: 0.0           # default 0.5   Prevent AI from flipping digits (OCR anti-interference) 
mosaic: 0.5           # default 1.0   Reduce the amount of excessively cropped images, and maintain the sharpness of the already small license plate area.
mixup: 0.0            
copy_paste: 0.0       
